name: SPaDE Integration Test (ARM)

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rbjones/spade_arm:latest

jobs:
  test-spade:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/rbjones/spade_arm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify container and environment
        shell: bash
        run: |
          echo "=== Container Debug Info ==="
          echo "USER: $(whoami)"
          echo "PWD: $(pwd)"
          echo "PATH: $PATH"
          ls -la /proofpower-source/ || echo "⚠️  /proofpower-source not found"
          ls -la /proofpower-source/dev_env || echo "⚠️  dev_env script not found"

      - name: Set up ProofPower
        shell: bash
        run: |
          set -ex
          export PPDIR=/proofpower-source
          echo "PATH before dev_env: $PATH"
          . /proofpower-source/dev_env || { echo "Failed to source dev_env"; exit 1; }
          echo "PATH after dev_env: $PATH"
          export PATH="/workspace/common:$PATH"
          which pp || { echo "ProofPower not in PATH"; exit 1; }
          echo "ProofPower found at: $(which pp)"

      - name: Test ProofPower
        shell: bash
        run: |
          set -ex
          echo "PATH before dev_env: $PATH"
          . /proofpower-source/dev_env
          echo "PATH after dev_env: $PATH"
          export PATH="/workspace/common:$PATH"
          pp -d hol <<< "print_theory \"min\";quit();" || { echo "ProofPower test failed"; exit 1; }

      - name: Run SPaDE tests
        shell: bash
        run: |
          set -ex
          echo "PATH before dev_env: $PATH"
          . /proofpower-source/dev_env
          echo "PATH after dev_env: $PATH"
          export PATH="/workspace/common:$PATH"
          make || { echo '--- failure logs ---'; find . -name '*.err' -o -name 'server.log' -print -exec cat {} \; ; echo '--- /tmp/spade_server_startup.log ---'; cat /tmp/spade_server_startup.log 2>/dev/null || true; exit 1; }
