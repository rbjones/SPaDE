name: SPaDE Test

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rbjones/spade:latest

jobs:
  test-spade:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rbjones/spade:latest
      options: --user root
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run SPaDE tests
        shell: bash
        run: make test
